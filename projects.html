<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Itshepeleng Lerato Portfolio - Projects</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <header class="navbar">
    <a href="index.html" class="nav-logo">✦</a>
    <nav class="nav-links">
      <a href="index.html" class="nav-item">ABOUT ME</a>
      <a href="projects.html" class="nav-item active">PROJECTS</a>
      <a href="contact.html" class="nav-item">CONTACT ME</a>
    </nav>
  </header>

  <main class="container">
    <section class="projects-section">
      <h1 class="page-title">PROJECTS</h1>

      <div class="projects-list" id="projectsList">
        </div>

      <dialog class="project-choice-dialog" id="projectChoiceDialog" aria-labelledby="projectDialogTitle">
        <button type="button" class="project-dialog-close" id="closeProjectDialog">Close</button>
        <h2 id="projectDialogTitle">Choose a destination</h2>
        <p id="projectDialogMessage"></p>
        <div class="project-dialog-options">
          <a class="project-dialog-option" id="projectGithubLink" href="" target="_blank" rel="noopener noreferrer">GitHub repository</a>
          <a class="project-dialog-option" id="projectLiveLink" href="" target="_blank" rel="noopener noreferrer" hidden>Live website</a>
          <button class="project-dialog-option" id="projectLiveUnavailable" type="button" disabled>Live website unavailable</button>
        </div>
      </dialog>
    </section>
  </main>

  <script src="js/projects.js"></script>
  <script src="js/page-scroll.js"></script>
</body>
</html>
